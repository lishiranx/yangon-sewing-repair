  .search-box {

  }

  .search-bar {

    margin-bottom: 16px;
  }
  .search-bar input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-bar .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 18px;
  }
  .search-bar .clear-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    display: none;
    padding: 4px;
  }
  .search-bar .clear-btn.show { display: block; }

  .stats {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 10px;
  }

  .filters {

    flex-wrap: wrap;

  }
  .filter-btn {
    padding: 6px 16px;

  .brand-filters {

    flex-wrap: wrap;
    gap: 6px;

  }
  .brand-btn {
    padding: 4px 12px;

    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 12px;

    color: var(--text-secondary);

    background: var(--tag-bg);
    color: var(--tag-text);

  .card {

    font-size: 14px;

  .symptom-list li::before {
    content: "!";
    position: absolute;
    left: 0;
    color: var(--warning);
    font-weight: 700;
  }
  .cause-list li::before {

    position: absolute;
    left: 0;
    color: var(--primary);

    counter-increment: step;
    position: relative;
    padding: 6px 0 6px 32px;
    font-size: 14px;
    line-height: 1.6;

    top: 6px;
    width: 22px;
    height: 22px;
    background: var(--primary-light);
    color: var(--primary);

    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;

    font-size: 14px;

    color: var(--text-secondary);

    line-height: 1.5;

  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

    color: var(--text-secondary);

    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);

    .card-header h2 { font-size: 15px; }

    .card-body { display: block !important; }
    .expand-icon { display: none; }
    .header { background: #1e3a5f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

</head>

let allData = [];

function highlightText(text, query) {
  if (!query || !text) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return String(text).replace(regex, '<span class="highlight">$1</span>');
}

function flatText(item) {
  const parts = [item.title, item.category, ...(item.brands || []), ...(item.tags || []), ...(item.symptoms || []), ...(item.causes || [])];
  if (item.steps) parts.push(...item.steps);
  if (item.items && Array.isArray(item.items)) {
    item.items.forEach(i => { parts.push(i.code || '', i.meaning || '', i.solution || ''); });
  }
  if (item.tips) parts.push(item.tips);
  return parts.join(' ').toLowerCase();
}

function getCategories() {
  const cats = [...new Set(allData.map(d => d.category))];
  return ['全部', ...cats.sort()];
}

function getBrands() {
  const brands = new Set();
  allData.forEach(d => (d.brands || []).forEach(b => brands.add(b)));
  return ['全部品牌', ...[...brands].sort()];
}

function renderCards(items, query) {
  if (!items.length) {
    return '<div class="empty-state"><div class="big-icon">&#128270;</div><p>没有找到匹配的结果，试试其他关键词</p></div>';
  }
  return items.map(item => {
    const title = query ? highlightText(item.title, query) : item.title;
    const symptoms = item.symptoms ? item.symptoms.map(s => `<li>${query ? highlightText(s, query) : s}</li>`).join('') : '';
    const causes = item.causes ? item.causes.map(c => `<li>${query ? highlightText(c, query) : c}</li>`).join('') : '';
    const steps = item.steps ? item.steps.map(s => `<li>${query ? highlightText(s, query) : s}</li>`).join('') : '';

    let codeTable = '';
    if (item.items && Array.isArray(item.items)) {
      const headers = Object.keys(item.items[0]);
      codeTable = `<table class="code-table"><thead><tr>${headers.map(h => {
        const labels = { code: '代码', meaning: '含义', solution: '解决方法', fault: '故障', causes: '原因' };
        return `<th>${labels[h] || h}</th>`;
      }).join('')}</tr></thead><tbody>${item.items.map(row => {
        return `<tr>${headers.map(h => {
          let val = row[h];
          if (Array.isArray(val)) val = val.join('；');
          return `<td>${query ? highlightText(val || '', query) : (val || '')}</td>`;
        }).join('')}</tr>`;
      }).join('')}</tbody></table>`;
    }

    const tipsHtml = item.tips ? `<div class="tips-box"><span class="label">提示：</span>${query ? highlightText(item.tips, query) : item.tips}</div>` : '';

    const brandsHtml = (item.brands || []).map(b => `<span class="meta-tag brand">${query ? highlightText(b, query) : b}</span>`).join('');

    return `<div class="card open">
      <div class="card-header" onclick="toggleCard(this)">
        <h2>${title}</h2>
        <span class="expand-icon">&#9660;</span>
      </div>
      <div class="card-body">
        <div class="meta-row">
          <span class="meta-tag">${item.category}</span>
          ${brandsHtml}
        </div>
        ${item.symptoms ? `<div class="section-title">现象</div><ul class="symptom-list">${symptoms}</ul>` : ''}
        ${item.causes ? `<div class="section-title">原因</div><ul class="cause-list">${causes}</ul>` : ''}
        ${item.steps ? `<div class="section-title">维修步骤</div><ol class="step-list">${steps}</ol>` : ''}
        ${codeTable}
        ${tipsHtml}
        ${item.check_method ? `<div class="tips-box" style="background:#eff6ff;border-left-color:var(--primary);margin-top:12px;"><strong>判断方法：</strong>${query ? highlightText(item.check_method, query) : item.check_method}</div>` : ''}
        ${item.interval ? `<div style="margin-top:8px;font-size:13px;color:var(--text-secondary);">周期：${item.interval}</div>` : ''}
        ${item.oil ? `<div style="margin-top:4px;font-size:13px;color:var(--text-secondary);">润滑油：${item.oil}</div>` : ''}
        ${item.tools ? `<div style="margin-top:8px;font-size:13px;color:var(--text-secondary);">所需工具：${item.tools.join('、')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function filterData(category, brand, query) {
  return allData.filter(item => {
    if (category !== '全部' && item.category !== category) return false;
    if (brand !== '全部品牌' && !(item.brands || []).includes(brand)) return false;
    if (query) {
      const q = query.toLowerCase();
      return flatText(item).includes(q);
    }
    return true;
  });
}

function updateUI() {
  const category = document.querySelector('#categoryFilters .active')?.dataset?.cat || '全部';
  const brand = document.querySelector('#brandFilters .active')?.dataset?.brand || '全部品牌';
  const query = document.getElementById('searchInput').value.trim();
  const filtered = filterData(category, brand, query);
  document.getElementById('totalCount').textContent = allData.length;
  document.getElementById('results').innerHTML = renderCards(filtered, query);
  document.getElementById('clearBtn').classList.toggle('show', query.length > 0);
}

function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

function buildFilters() {
  const catContainer = document.getElementById('categoryFilters');
  const cats = getCategories();
  catContainer.innerHTML = cats.map((c, i) =>
    `<button class="filter-btn${i === 0 ? ' active' : ''}" data-cat="${c}" onclick="setCategory(this)">${c}</button>`
  ).join('');

  const brandContainer = document.getElementById('brandFilters');
  const brands = getBrands();
  brandContainer.innerHTML = brands.map((b, i) =>
    `<button class="brand-btn${i === 0 ? ' active' : ''}" data-brand="${b}" onclick="setBrand(this)">${b}</button>`
  ).join('');
}

function setCategory(el) {
  document.querySelectorAll('#categoryFilters .active').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  updateUI();
}

function setBrand(el) {
  document.querySelectorAll('#brandFilters .active').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  updateUI();
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(updateUI, 200);
});

document.getElementById('clearBtn').addEventListener('click', function() {
  document.getElementById('searchInput').value = '';
  updateUI();
});

// Data loaded from embedded data below
allData = embeddedData;
document.getElementById('loading').style.display = 'none';
buildFilters();
updateUI();
</script>
